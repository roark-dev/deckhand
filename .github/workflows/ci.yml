name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. a force-push to a PR) so only
# the latest commit's checks keep running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Linux jobs run on deckhand's own self-hosted runner (dogfooding + no
# GitHub-hosted minutes). PUBLIC-REPO SAFETY: fork PRs never auto-run here —
# the repo's fork-PR policy requires maintainer approval for all external
# contributors, so external code only runs on the Mac after review.
# macOS stays GitHub-hosted: deckhand runs Linux containers, but the darwin
# code paths (launchd service, peercred_darwin) still need coverage.
jobs:
  lint:
    runs-on: deckhand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint # go vet + gofmt

  test:
    runs-on: deckhand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make cover # race-enabled tests + coverage gate

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make cover

  build:
    runs-on: deckhand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  tidy:
    runs-on: deckhand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result"
            git diff -- go.mod go.sum
            exit 1
          fi
