name: runner-image

# Build + publish the deckhand CI runner image (images/ci-runner) to GHCR when
# its Dockerfile changes. Point a daemon's runner.image at the published tag to
# run Go CI (make, -race/cgo) on self-hosted deckhand runners.
on:
  push:
    branches: [main]
    paths:
      - images/ci-runner/**
      - .github/workflows/runner-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/ci-runner
          push: true
          tags: ghcr.io/roark-dev/deckhand-ci-runner:latest
